services:
  elasticsearch_winfried:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    container_name: elasticsearch_winfried
    mem_limit: 2g
    volumes:
      - elasticsearch-data-winfried:/usr/share/elasticsearch/data
      - ./es_snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "127.0.0.1:9201:9200"
    restart: always
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - path.repo=/usr/share/elasticsearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana_winfried:
    depends_on:
      - elasticsearch_winfried
    image: docker.elastic.co/kibana/kibana:8.16.1
    container_name: kibana_winfried
    volumes:
      - kibana-data-winfried:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5602:5601"
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch_winfried:9200

volumes:
  elasticsearch-data-winfried:
  kibana-data-winfried:
